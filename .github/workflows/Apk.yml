name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Используем актуальную LTS-версию

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # КРИТИЧНО! Современный Capacitor требует Java 21

      - name: Install dependencies
        run: npm install # Используем install, чтобы не требовать package-lock.json

      - name: Add and Sync Android Platform
        run: |
          rm -rf android  # Удаляем старую папку, чтобы избежать ошибок при генерации
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhdem-mishu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
