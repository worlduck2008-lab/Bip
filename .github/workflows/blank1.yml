name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # Рекомендуется использовать актуальную LTS-версию

      - name: Setup Java
        uses: actions/setup-java@v5   # ✅ Обновлено до v5
        with:
          distribution: temurin
          java-version: 21   # ✅ Исправлено на Java 21

      - name: Install dependencies
        run: npm ci   # ✅ Используем ci для чистоты сборки

      - name: Clean and add Android platform
        run: |
          rm -rf android        # ✅ Удаляем старую папку, если есть
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace   # ✅ Добавлен --stacktrace для деталей
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhdem-mishu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
